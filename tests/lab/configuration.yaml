homeassistant:
  name: HA Operator Lab
analytics:
frontend:
sun:
adaptive_lighting:
  - name: Lab ambient
    lights: [light.sim_ambient_light]
    min_brightness: 60
    max_brightness: 60
    min_color_temp: 3500
    max_color_temp: 3500
    transition: 0
    initial_transition: 0
    sleep_transition: 0
    only_once: true
    adapt_only_on_bare_turn_on: true
    detect_non_ha_changes: true
    take_over_control: true
    intercept: true
lovelace:
  mode: storage
config:
backup:
diagnostics:
schedule:
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
input_text:
input_boolean:
  demo_evening:
    name: Evening ventilation
    initial: false
input_datetime:
timer:
api:
websocket_api:
history:
logbook:
recorder:
  purge_keep_days: 1
persistent_notification:
logger:
  default: warning
  logs:
    custom_components.ha_operator: debug
ha_operator_sim:
  url: http://simulator:8099
  poll_interval: 1
homekit:
  - name: HA Operator Lab
    port: 21063
    ip_address: LAB_HA_ADDRESS
    advertise_ip: [LAB_HA_ADDRESS]
    filter:
      include_domains: [cover, fan, light]
      include_entities: [switch.lab_central_sleep_public, switch.lab_room_sleep_public]
      exclude_entity_globs: ["cover.sim_*", "fan.sim_*", "light.sim_*"]

template:
  - binary_sensor:
      - name: Lab native cold qualified
        unique_id: lab_native_cold_qualified
        state: "{{ states('sensor.sim_window_temperature') | float(100) < 16 }}"
        availability: "{{ has_value('sensor.sim_window_temperature') }}"
        delay_on:
          seconds: 2
  - sensor:
      - name: Lab setpoint observer
        unique_id: lab_setpoint_observer
        state: "{{ states('number.sim_setpoint') }}"
  - switch:
      - name: Lab awaited actor
        unique_id: lab_awaited_actor
        state: "{{ is_state('switch.sim_room_lighting', 'on') }}"
        availability: "{{ has_value('switch.sim_room_lighting') }}"
        turn_on:
          - wait_template: "{{ is_state('binary_sensor.sim_cellar_demand', 'on') }}"
            timeout:
              seconds: 30
            continue_on_timeout: false
          - action: switch.turn_on
            target:
              entity_id: switch.sim_room_lighting
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.sim_room_lighting
